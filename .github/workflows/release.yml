name: Release node-agent
run-name: Release node-agent ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 1.2.3 or v1.2.3)
        required: true
        type: string

# Serialize releases so two manual runs cannot race while creating tags.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Validate version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require the default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "${RUN_REF}" != "${DEFAULT_BRANCH}" ]]; then
            echo "::error::Releases must run from the default branch ${DEFAULT_BRANCH}, not ${RUN_REF}."
            exit 1
          fi

      - name: Normalize and validate version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="${INPUT_VERSION#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'

          if [[ ! "${version}" =~ ${semver} ]]; then
            echo "::error::Version must be SemVer, for example 1.2.3 or v1.2.3-rc.1."
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

          version_without_build="${version%%+*}"
          if [[ "${version_without_build}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: node-agent
            extension: ""
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            executable: node-agent
            extension: ""
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            executable: node-agent.exe
            extension: .exe
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            executable: node-agent
            extension: ""
          - runner: macos-15
            target: aarch64-apple-darwin
            executable: node-agent
            extension: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: node-agent-rs
    env:
      ASSET_NAME: node-agent-${{ needs.prepare.outputs.version }}-${{ matrix.target }}${{ matrix.extension }}
      NODE_AGENT_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: node-agent-rs

      - name: Check out shoes-plus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 0xddy/shoes-plus
          # Keep release artifacts reproducible across shoes-plus main updates.
          ref: f010c624b063e6c4fb1a9702cc6ac564895ebb8a
          path: shoes-plus

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
          shared-key: release-${{ matrix.target }}
          workspaces: node-agent-rs -> target

      - name: Build release binary
        run: cargo build --release --locked -p node-agent --bin node-agent --target ${{ matrix.target }}

      - name: Verify embedded version
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.executable }}"
          actual="$("${binary}" version --json)"
          expected="{\"version\":\"${NODE_AGENT_VERSION}\"}"

          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::Expected ${expected}, got ${actual}."
            exit 1
          fi

      - name: Verify embedded version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target/${{ matrix.target }}/release/${{ matrix.executable }}"
          $actual = (& $binary version --json).Trim()
          $expected = @{ version = $env:NODE_AGENT_VERSION } | ConvertTo-Json -Compress

          if ($actual -ne $expected) {
            throw "Expected $expected, got $actual."
          }

      - name: Stage release binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          asset="dist/${ASSET_NAME}"

          mkdir -p dist
          install -m 755 "target/${{ matrix.target }}/release/${{ matrix.executable }}" "${asset}"

          size="$(wc -c < "${asset}")"
          if (( size >= 2147483648 )); then
            echo "::error::Release assets must be smaller than 2 GiB; ${ASSET_NAME} is ${size} bytes."
            exit 1
          fi

      - name: Stage release binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $asset = Join-Path "dist" $env:ASSET_NAME

          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.executable }}" $asset
          $size = (Get-Item $asset).Length
          if ($size -ge 2GB) {
            throw "Release assets must be smaller than 2 GiB; $env:ASSET_NAME is $size bytes."
          }

      - name: Upload compiled binary for release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: node-agent-rs/dist/${{ env.ASSET_NAME }}
          if-no-files-found: error
          retention-days: 1
          # This compression is only for the short-lived cross-job artifact.
          # The GitHub Release receives the original, uncompressed executable.
          compression-level: 9

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: node-agent-rs
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: node-agent-rs
          persist-credentials: false

      - name: Download compiled binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: node-agent-rs/release-assets
          merge-multiple: true

      - name: Verify release assets and create checksums
        shell: bash
        run: |
          set -euo pipefail

          expected_assets=(
            "node-agent-${VERSION}-x86_64-unknown-linux-gnu"
            "node-agent-${VERSION}-aarch64-unknown-linux-gnu"
            "node-agent-${VERSION}-x86_64-pc-windows-msvc.exe"
            "node-agent-${VERSION}-x86_64-apple-darwin"
            "node-agent-${VERSION}-aarch64-apple-darwin"
          )

          for asset in "${expected_assets[@]}"; do
            path="release-assets/${asset}"
            if [[ ! -s "${path}" ]]; then
              echo "::error::Missing release asset: ${asset}"
              exit 1
            fi

            size="$(wc -c < "${path}")"
            if (( size >= 2147483648 )); then
              echo "::error::Release assets must be smaller than 2 GiB; ${asset} is ${size} bytes."
              exit 1
            fi
          done

          (
            cd release-assets
            sha256sum "${expected_assets[@]}" > SHA256SUMS
          )

          asset_count="$(find release-assets -maxdepth 1 -type f | wc -l)"
          if [[ "${asset_count}" -ne 6 ]]; then
            echo "::error::Expected 5 binaries and SHA256SUMS, found ${asset_count} release assets."
            exit 1
          fi

      - name: Publish release
        id: publish
        shell: bash
        run: |
          set -euo pipefail

          encoded_default_branch="$(jq -rn --arg value "${DEFAULT_BRANCH}" '$value | @uri')"
          default_head="$(gh api "repos/${GH_REPO}/commits/${encoded_default_branch}" --jq .sha)"
          if [[ "${default_head}" != "${GITHUB_SHA}" ]]; then
            echo "::error::The default branch advanced from ${GITHUB_SHA} to ${default_head} while this run was building. Re-run the workflow from the latest ${DEFAULT_BRANCH}; publishing an older workflow-bearing commit is intentionally blocked."
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            tagged_commit="$(git rev-list -n 1 "${TAG}")"
            if [[ "${tagged_commit}" != "${GITHUB_SHA}" ]]; then
              echo "::error::Tag ${TAG} already points to ${tagged_commit}, not ${GITHUB_SHA}."
              exit 1
            fi
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists. Use a new version; published assets are immutable."
            exit 1
          fi

          assets=(
            "release-assets/node-agent-${VERSION}-x86_64-unknown-linux-gnu"
            "release-assets/node-agent-${VERSION}-aarch64-unknown-linux-gnu"
            "release-assets/node-agent-${VERSION}-x86_64-pc-windows-msvc.exe"
            "release-assets/node-agent-${VERSION}-x86_64-apple-darwin"
            "release-assets/node-agent-${VERSION}-aarch64-apple-darwin"
            "release-assets/SHA256SUMS"
          )

          create_args=(
            release create "${TAG}"
            "${assets[@]}"
            --target "${GITHUB_SHA}"
            --title "node-agent ${TAG}"
            --generate-notes
            --notes "Linux and macOS assets are raw executables; run chmod +x on the downloaded file before starting it."
          )

          if [[ "${PRERELEASE}" == "true" ]]; then
            create_args+=(--prerelease)
          fi

          gh "${create_args[@]}"

          release_url="$(gh release view "${TAG}" --json url --jq .url)"
          echo "url=${release_url}" >> "${GITHUB_OUTPUT}"

      - name: Write job summary
        shell: bash
        env:
          RELEASE_URL: ${{ steps.publish.outputs.url }}
        run: |
          {
            echo "## Published node-agent ${TAG}"
            echo
            echo "- Release: [${TAG}](${RELEASE_URL})"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Assets: 5 raw platform binaries plus SHA256SUMS"
          } >> "${GITHUB_STEP_SUMMARY}"

  cleanup:
    name: Delete temporary build artifacts
    if: ${{ always() }}
    needs:
      - build
      - release
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Reclaim Actions artifact storage
        shell: bash
        run: |
          set -u

          if ! artifact_ids="$(
            gh api --paginate "repos/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("release-")) | .id'
          )"; then
            echo "::warning::Could not list temporary Actions artifacts; they will expire after 1 day."
            exit 0
          fi

          while IFS= read -r artifact_id; do
            [[ -z "${artifact_id}" ]] && continue
            if ! gh api --method DELETE "repos/${GH_REPO}/actions/artifacts/${artifact_id}" >/dev/null; then
              echo "::warning::Could not delete temporary Actions artifact ${artifact_id}; it will expire after 1 day."
            fi
          done <<< "${artifact_ids}"
