name: Release node-agent
run-name: Release node-agent ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 1.2.3 or v1.2.3)
        required: true
        type: string

# Serialize releases so two manual runs cannot race while creating tags.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Validate version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Normalize and validate version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="${INPUT_VERSION#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'

          if [[ ! "${version}" =~ ${semver} ]]; then
            echo "::error::Version must be SemVer, for example 1.2.3 or v1.2.3-rc.1."
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

          version_without_build="${version%%+*}"
          if [[ "${version_without_build}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: node-agent
            archive: tar.gz
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            executable: node-agent
            archive: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            executable: node-agent.exe
            archive: zip
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            executable: node-agent
            archive: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            executable: node-agent
            archive: tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      ASSET_NAME: node-agent-${{ needs.prepare.outputs.version }}-${{ matrix.target }}
      NODE_AGENT_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
          shared-key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked -p node-agent --bin node-agent --target ${{ matrix.target }}

      - name: Verify embedded version
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.executable }}"
          actual="$("${binary}" version --json)"
          expected="{\"version\":\"${NODE_AGENT_VERSION}\"}"

          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::Expected ${expected}, got ${actual}."
            exit 1
          fi

      - name: Verify embedded version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target/${{ matrix.target }}/release/${{ matrix.executable }}"
          $actual = (& $binary version --json).Trim()
          $expected = @{ version = $env:NODE_AGENT_VERSION } | ConvertTo-Json -Compress

          if ($actual -ne $expected) {
            throw "Expected $expected, got $actual."
          }

      - name: Package release archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/${ASSET_NAME}"

          mkdir -p "${package_dir}"
          install -m 755 "target/${{ matrix.target }}/release/${{ matrix.executable }}" "${package_dir}/node-agent"
          cp README.md "${package_dir}/README.md"
          tar -C dist -czf "dist/${ASSET_NAME}.tar.gz" "${ASSET_NAME}"

      - name: Package release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = Join-Path "dist" $env:ASSET_NAME
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.executable }}" (Join-Path $packageDir "node-agent.exe")
          Copy-Item "README.md" (Join-Path $packageDir "README.md")
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath "dist/$env:ASSET_NAME.zip"

      - name: Upload compiled archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ env.ASSET_NAME }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download compiled archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets and create checksums
        shell: bash
        run: |
          set -euo pipefail

          expected_assets=(
            "node-agent-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            "node-agent-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
            "node-agent-${VERSION}-x86_64-pc-windows-msvc.zip"
            "node-agent-${VERSION}-x86_64-apple-darwin.tar.gz"
            "node-agent-${VERSION}-aarch64-apple-darwin.tar.gz"
          )

          for asset in "${expected_assets[@]}"; do
            if [[ ! -f "release-assets/${asset}" ]]; then
              echo "::error::Missing release asset: ${asset}"
              exit 1
            fi
          done

          (
            cd release-assets
            sha256sum "${expected_assets[@]}" > SHA256SUMS
          )

      - name: Publish release
        id: publish
        shell: bash
        run: |
          set -euo pipefail

          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            tagged_commit="$(git rev-list -n 1 "${TAG}")"
            if [[ "${tagged_commit}" != "${GITHUB_SHA}" ]]; then
              echo "::error::Tag ${TAG} already points to ${tagged_commit}, not ${GITHUB_SHA}."
              exit 1
            fi
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists. Use a new version; published assets are immutable."
            exit 1
          fi

          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)

          create_args=(
            release create "${TAG}"
            "${assets[@]}"
            --target "${GITHUB_SHA}"
            --title "node-agent ${TAG}"
            --generate-notes
          )

          if [[ "${PRERELEASE}" == "true" ]]; then
            create_args+=(--prerelease)
          fi

          gh "${create_args[@]}"

          release_url="$(gh release view "${TAG}" --json url --jq .url)"
          echo "url=${release_url}" >> "${GITHUB_OUTPUT}"

      - name: Write job summary
        shell: bash
        env:
          RELEASE_URL: ${{ steps.publish.outputs.url }}
        run: |
          {
            echo "## Published node-agent ${TAG}"
            echo
            echo "- Release: [${TAG}](${RELEASE_URL})"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Assets: 5 platform archives plus SHA256SUMS"
          } >> "${GITHUB_STEP_SUMMARY}"
