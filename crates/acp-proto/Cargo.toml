[package]
name = "acp-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The ACP wire contract, shared verbatim with `panel-api-server`.
#
# This crate is the only place that knows how ACP is encoded and how its two
# authentication primitives are derived. Everything above it deals in Rust
# types, never in bytes on a wire.
#
# `proto/acp.proto` is a copy, not a fork -- see `PROTO_SHA256` in src/lib.rs.

[dependencies]
prost.workspace = true
tonic.workspace = true
tonic-prost.workspace = true

base64.workspace = true
hmac.workspace = true
rand.workspace = true
sha2.workspace = true

[build-dependencies]
prost-build.workspace = true
protox.workspace = true
tonic-prost-build.workspace = true
