[package]
name = "node-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Live nftables tests also require ACP_PORTHOPPING_LINUX_INTEGRATION=1 and
# CAP_NET_ADMIN. Keeping both gates prevents ordinary test runs from touching
# host firewall state.
porthopping-linux-integration = []

[lib]
name = "node_agent"
path = "src/lib.rs"

[[bin]]
name = "node-agent"
path = "src/main.rs"

[dependencies]
acp-proto.workspace = true
async-trait.workspace = true
chrono.workspace = true
if-addrs.workspace = true
log.workspace = true
mimalloc.workspace = true
rand.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
shoes.workspace = true
shoes-api.workspace = true
shoes-engine.workspace = true
sysinfo.workspace = true
toml.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tonic.workspace = true
url.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "*"
netlink-packet-core = "0.9.0"
netlink-packet-netfilter = "0.4.0"
netlink-sys = "0.8.7"

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
rcgen.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
